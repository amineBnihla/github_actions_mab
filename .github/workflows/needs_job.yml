      - name: "running job 1"
        run: echo "running job 1"
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: "running job 2"
        run:  echo "running job 2"
  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: "running job 3"
        run:  echo "running job 4"
  job_4:
    runs-on: ubuntu-latest
    needs: 
     - job_2
     - job_3
    steps:
      - name: "running job 4"
        run:  echo "running job 4"
